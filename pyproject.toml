[project]
name = "achichi-notifier"
version = "0.1.0"
description = "Discord bot that announces new videos, shorts, live-stream slots and posts from the YouTube channel @AchichiMela"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "discord.py>=2.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["achichi_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
