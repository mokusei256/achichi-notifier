name: tests

# GitHub is used only to test this project (the bot itself runs on our own PCs; see README).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.17"   # same uv that produced uv.lock
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Unit tests (no network, no secrets)
        run: uv run --frozen pytest -q
